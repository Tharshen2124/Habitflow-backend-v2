# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html

one:
  username: fixture_one
  email: fixture-one@example.com
  password_digest: <%= BCrypt::Password.create("password123") %>
  is_onboarded: false
  email_notifications_enabled: false

two:
  username: fixture_two
  email: fixture-two@example.com
  password_digest: <%= BCrypt::Password.create("password123") %>
  google_uid: google-fixture-uid-2
  is_onboarded: true
  email_notifications_enabled: false

# Dedicated to /history: it is the only user with a *past* week, and the only one carrying an
# archived role, a dropped goal and a deleted activity at once. Kept apart from users(:one) because
# roles_controller_test asserts that user's exact role and archived-role counts.
three:
  username: fixture_three
  email: fixture-three@example.com
  password_digest: <%= BCrypt::Password.create("password123") %>
  is_onboarded: true
  email_notifications_enabled: false

# Dedicated to carry-forward lineage: the only user whose goals form a chain across several weeks.
# Kept apart from users(:three) because the week-strip tests assert that user's exact week count.
four:
  username: fixture_four
  email: fixture-four@example.com
  password_digest: <%= BCrypt::Password.create("password123") %>
  is_onboarded: true
  email_notifications_enabled: false

# The only user with a Google Calendar grant. Kept apart from the other four because every
# task-writing test for them would otherwise enqueue a CalendarSyncJob -- and the tests asserting
# that *no* job is enqueued need a user who could never have one.
calendar:
  username: fixture_calendar
  email: fixture-calendar@example.com
  password_digest: <%= BCrypt::Password.create("password123") %>
  is_onboarded: true
  email_notifications_enabled: false
  calendar_id: c_habitflow@group.calendar.google.com
  calendar_access_token: fixture-calendar-access-token
  calendar_refresh_token: fixture-calendar-refresh-token
  calendar_token_expires_at: <%= 1.hour.from_now.to_fs(:db) %>
