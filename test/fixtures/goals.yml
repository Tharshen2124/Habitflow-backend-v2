# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html

one:
  role: one
  weekly_plan: one
  description: Complete quarterly project milestone

two:
  role: one
  weekly_plan: one
  description: Mentor junior team member
  is_weekly_priority: true

three:
  role: two
  weekly_plan: two
  description: Plan weekend family activity

# The past week's four goals, one of each outcome the history page has to tell apart.
past_achieved:
  role: standing
  weekly_plan: past
  description: Ship the FYP
  is_weekly_priority: true
  is_completed: true

past_missed:
  role: standing
  weekly_plan: past
  description: Write the evaluation chapter

past_dropped:
  role: standing
  weekly_plan: past
  description: Rewrite the ERD diagram
  deleted_at: <%= Time.current.to_fs(:db) %>

past_archived_role:
  role: retired
  weekly_plan: past
  description: Run the Saturday session
  is_completed: true

# One goal per week, each a fresh row continuing the last -- goals are week-owned, so this is what
# "the same goal for four weeks" actually looks like in the schema.
chain_one:
  role: persistent
  weekly_plan: chain_first
  description: Finish the literature review

chain_two:
  role: persistent
  weekly_plan: chain_second
  description: Finish the literature review

chain_three:
  role: persistent
  weekly_plan: chain_third
  description: Finish the literature review

chain_four:
  role: persistent
  weekly_plan: chain_fourth
  description: Finish the literature review

# Begun in the third week and never carried anywhere: the control the chain is measured against.
chain_fresh:
  role: persistent
  weekly_plan: chain_third
  description: Book the lab session
  is_completed: true
